<text x="780.0" y="380" font-size="12" font-weight="600" fill="#374151" text-anchor="middle">8 workers (1024 slots)</text>
<rect x="736.0" y="175.8" width="42.0" height="182.2" rx="3" fill="#16a34a"/>
