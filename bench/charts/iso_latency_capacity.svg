<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" width="100%" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: #ffffff; border: 1px solid #e5e7eb; border-radius: 8px;">
<text x="80" y="30" font-size="16" font-weight="700" fill="#111827">How Many Parallel Flows Can You Run at 128 Slots/Worker Without Hurting Latency?</text>
<text x="80" y="50" font-size="12" fill="#4b5563">Max parallel workflows supported while keeping p95 latency ≤ 1.5× (1608 ms) or ≤ 2.0× (2144 ms) of single-flow baseline (1072 ms).</text>
<rect x="80" y="63" width="14" height="14" rx="3" fill="#16a34a"/>
<text x="100" y="74" font-size="12" font-weight="600" fill="#1f2937">Strict SLA: p95 ≤ 1.5× baseline (1608 ms)</text>
<rect x="401.0" y="63" width="14" height="14" rx="3" fill="#2563eb"/>
<text x="421.0" y="74" font-size="12" font-weight="600" fill="#1f2937">Relaxed SLA: p95 ≤ 2.0× baseline (2144 ms)</text>
<line x1="80" y1="358.0" x2="880" y2="358.0" stroke="#d1d5db" stroke-width="1"/>
<text x="70" y="362.0" font-size="11" fill="#6b7280" text-anchor="end">0.00 wf</text>
<line x1="80" y1="306.4" x2="880" y2="306.4" stroke="#f3f4f6" stroke-width="1"/>
<text x="70" y="310.4" font-size="11" fill="#6b7280" text-anchor="end">240 wf</text>
<line x1="80" y1="254.8" x2="880" y2="254.8" stroke="#f3f4f6" stroke-width="1"/>
<text x="70" y="258.8" font-size="11" fill="#6b7280" text-anchor="end">480 wf</text>
<line x1="80" y1="203.2" x2="880" y2="203.2" stroke="#f3f4f6" stroke-width="1"/>
<text x="70" y="207.2" font-size="11" fill="#6b7280" text-anchor="end">720 wf</text>
<line x1="80" y1="151.6" x2="880" y2="151.6" stroke="#f3f4f6" stroke-width="1"/>
<text x="70" y="155.6" font-size="11" fill="#6b7280" text-anchor="end">960 wf</text>
<line x1="80" y1="100.0" x2="880" y2="100.0" stroke="#f3f4f6" stroke-width="1"/>
<text x="70" y="104.0" font-size="11" fill="#6b7280" text-anchor="end">1,200 wf</text>
<text x="180.0" y="380" font-size="12" font-weight="600" fill="#374151" text-anchor="middle">1 worker (128 slots)</text>
