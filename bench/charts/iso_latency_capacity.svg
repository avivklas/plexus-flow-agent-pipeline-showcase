<text x="380.0" y="380" font-size="12" font-weight="600" fill="#374151" text-anchor="middle">2 workers (256 slots)</text>
<rect x="336.0" y="297.8" width="42.0" height="60.2" rx="3" fill="#16a34a"/>
<text x="357.0" y="291.8" font-size="11" font-weight="700" fill="#16a34a" text-anchor="middle">280 wf</text>
