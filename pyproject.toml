[project]
name = "agent-pipeline-showcase"
version = "0.1.0"
description = "Showcase for plexus-flow: an LLM agent pipeline (support ticket resolver) with retries, human approval, and saga rollback of agent side effects"
requires-python = ">=3.11"
dependencies = [
    "plexus-flow",
    "httpx>=0.28",
]

[tool.uv.sources]
plexus-flow = { path = "../plexus-flow/sdk/python", editable = true }

[tool.uv]
package = false
